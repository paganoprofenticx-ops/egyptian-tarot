  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#F8EFDB"/>
      <stop offset="0.46" stop-color="#EFE3C8"/>
      <stop offset="1" stop-color="#D4BE97"/>
    </linearGradient>
    <radialGradient id="panel" cx="50%" cy="42%" r="66%">
